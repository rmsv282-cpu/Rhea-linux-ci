name: build-rheaos

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Install host build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex texinfo \
            gawk wget xz-utils bc rsync cpio libncurses-dev \
            genisoimage xorriso mtools e2fsprogs

      - name: Run orchestrate
        run: |
          chmod +x orchestrate.sh
          ./orchestrate.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rheaos-build
          path: |
            build/*.log
            artifacts/*.img
            artifacts/*.iso
          if-no-files-found: warn

